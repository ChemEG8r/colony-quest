<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colony Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #F5EDDC;
    --surface: #FDF8EC;
    --ink: #33261A;
    --muted: #6E6152;
    --accent: #274C77;
    --accent-soft: rgba(39, 76, 119, 0.10);
    --on-accent: #FDF8EC;
    --seal: #96342B;
    --good: #3B7A3A;
    --good-soft: rgba(59, 122, 58, 0.13);
    --bad: #A83226;
    --bad-soft: rgba(168, 50, 38, 0.11);
    --line: #DCCFB4;
    --shadow: 0 2px 10px rgba(51, 38, 26, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191410;
      --surface: #241D16;
      --ink: #EFE6D5;
      --muted: #A99A85;
      --accent: #7FA6D0;
      --accent-soft: rgba(127, 166, 208, 0.14);
      --on-accent: #191410;
      --seal: #D4776B;
      --good: #6FB36E;
      --good-soft: rgba(111, 179, 110, 0.15);
      --bad: #E07A6D;
      --bad-soft: rgba(224, 122, 109, 0.13);
      --line: #3B3125;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191410;
    --surface: #241D16;
    --ink: #EFE6D5;
    --muted: #A99A85;
    --accent: #7FA6D0;
    --accent-soft: rgba(127, 166, 208, 0.14);
    --on-accent: #191410;
    --seal: #D4776B;
    --good: #6FB36E;
    --good-soft: rgba(111, 179, 110, 0.15);
    --bad: #E07A6D;
    --bad-soft: rgba(224, 122, 109, 0.13);
    --line: #3B3125;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: "Atkinson Hyperlegible", "Avenir Next", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 18px 14px 48px; }

  h1, h2 { font-family: "IM Fell English", Georgia, serif; font-weight: 400; text-wrap: balance; margin: 0; }
  h3 { margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 2px 14px; }
  .brand { font-family: "IM Fell English", Georgia, serif; font-size: 26px; }
  .brand span { color: var(--seal); }
  .navlink {
    background: none; border: none; padding: 4px 2px; cursor: pointer;
    color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px;
  }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px 18px; margin-bottom: 14px; }
  .card.seal-top { border-top: 4px solid var(--seal); }

  .hero h1 { font-size: 34px; line-height: 1.1; }
  .hero p { color: var(--muted); margin: 10px 0 0; }
  .topic-list { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .topic-list li { font-size: 14px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 10px; padding: 13px 20px; min-height: 52px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    touch-action: manipulation;
  }
  .btn:focus-visible, .navlink:focus-visible, input:focus-visible, details summary:focus-visible, .opt:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 17px; }
  .btn-wide { width: 100%; }
  .btn-danger { color: var(--bad); }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn-row .btn { flex: 1; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .stat .num { font-family: "IBM Plex Mono", monospace; font-size: 23px; font-weight: 600; }
  .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }

  /* ---------- Quiz ---------- */
  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; }
  .progress .label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.25s ease; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }

  .qtopic { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--seal); margin-bottom: 8px; }
  .qtext { font-size: 20px; font-weight: 700; margin: 0 0 14px; }
  .qtext .blank { border-bottom: 2px solid var(--accent); padding: 0 24px; }

  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    font: inherit; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer;
    border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
    padding: 13px 14px; min-height: 52px; touch-action: manipulation;
  }
  .opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .opt:disabled { cursor: default; opacity: 1; }
  .opt.dim:disabled { opacity: 0.55; }

  .answer-line { display: flex; gap: 8px; }
  input.answer {
    flex: 1; width: 100%; min-height: 52px; padding: 8px 14px;
    font: inherit; font-size: 18px; font-weight: 700;
    color: var(--ink); background: var(--surface);
    border: 2px solid var(--line); border-radius: 10px;
  }
  input.answer::placeholder { color: var(--muted); opacity: 0.6; font-weight: 400; }
  .answer-line .btn { flex: 0 0 auto; }

  .feedback { min-height: 46px; border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 10px; }
  .feedback.neutral { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); }
  .feedback.right { color: var(--good); background: var(--good-soft); font-weight: 700; }
  .feedback.wrong { color: var(--bad); background: var(--bad-soft); font-weight: 700; }
  .feedback .why { display: block; font-weight: 400; color: var(--ink); margin-top: 4px; }

  /* ---------- Results / history ---------- */
  .score-hero { text-align: center; padding: 26px 18px; }
  .score-big { font-family: "IBM Plex Mono", monospace; font-size: 54px; font-weight: 600; line-height: 1; }
  .score-msg { font-family: "IM Fell English", Georgia, serif; font-size: 24px; margin-top: 10px; }
  .score-sub { color: var(--muted); margin-top: 4px; }

  .misslist { margin: 0; padding: 0; list-style: none; }
  .misslist li { padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .misslist li:last-child { border-bottom: none; }
  .misslist .q { font-weight: 700; display: block; }
  .misslist .a { color: var(--bad); }
  .misslist .cor { color: var(--good); font-weight: 700; }
  .allgood { color: var(--good); font-weight: 700; padding: 10px 4px; }

  .hrow { border-bottom: 1px solid var(--line); }
  .hrow:last-child { border-bottom: none; }
  .hrow summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 4px; cursor: pointer; list-style: none; }
  .hrow summary::-webkit-details-marker { display: none; }
  .hdate { font-size: 15px; flex: 1; }
  .hdate small { display: block; color: var(--muted); }
  .hscore { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 14px; color: var(--muted); }
  .hpct { font-family: "IBM Plex Mono", monospace; font-weight: 600; border-radius: 999px; padding: 4px 11px; font-size: 14px; }
  .pct-good { color: var(--good); background: var(--good-soft); }
  .pct-mid  { color: var(--accent); background: var(--accent-soft); }
  .pct-low  { color: var(--bad); background: var(--bad-soft); }
  .hdetail { padding: 0 4px 12px; }

  .trouble .tlabel { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .trouble .tlabel .mono { color: var(--muted); font-weight: 600; font-size: 13px; }
  .tbar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 9px; }
  .tbar > div { height: 100%; border-radius: 999px; background: var(--bad); }

  /* ---------- Study sheet ---------- */
  .study h3 { font-size: 17px; margin: 16px 0 6px; color: var(--accent); }
  .study h3:first-of-type { margin-top: 0; }
  .study ul { margin: 0; padding-left: 20px; }
  .study li { margin-bottom: 5px; font-size: 15.5px; }
  .study b { color: var(--seal); }
  .study table { border-collapse: collapse; width: 100%; margin: 6px 0 4px; }
  .study th, .study td { border: 1px solid var(--line); padding: 7px 8px; font-size: 14px; text-align: left; vertical-align: top; }
  .study th { background: var(--accent-soft); color: var(--accent); }
  .tablewrap { overflow-x: auto; }

  .empty { color: var(--muted); text-align: center; padding: 26px 10px; }
  .footnote { color: var(--muted); font-size: 13px; text-align: center; margin-top: 18px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Colony <span>Quest</span></div>
    <button class="navlink" id="navBtn"></button>
  </div>
  <div id="app"></div>
</div>
<canvas id="confetti" hidden></canvas>

<script>
"use strict";

/* ================= question bank (from VJ's Colonial America study guide) =================
   type "mc": options[0] is always correct (shuffled at display time)
   type "type": typed answer; `accept` lists extra OK answers */
const BANK = [
  // ----- Key terms -----
  { t: "Key terms", type: "type", q: "A type of government in which the people rule.", a: "democracy", why: "Democracy = the people rule." },
  { t: "Key terms", type: "mc", q: "What is the SOCIAL CONTRACT?", o: ["An agreement between the government and the people", "A contract to buy land", "A treaty between two countries", "A list of laws written by a king"], why: "The social contract: an agreement exists between the government and the people." },
  { t: "Key terms", type: "type", q: "The state of being free in society.", a: "liberty", accept: ["libertey"], why: "Liberty = the state of being free in society." },
  { t: "Key terms", type: "type", q: "A refusal to buy goods — like the colonists refusing to buy British goods.", a: "boycott", accept: ["boycot", "boycotting"], why: "A boycott is a refusal to buy goods." },
  { t: "Key terms", type: "type", q: "To officially end or cancel a law.", a: "repeal", why: "To repeal a law is to officially end or cancel it." },
  { t: "Key terms", type: "type", q: "A written, legally binding agreement or covenant for self-governance.", a: "compact", why: "A compact is a written, legally binding agreement for self-governance." },
  { t: "Key terms", type: "mc", q: "Parliament decided to REPEAL the Stamp Act. That means they…", o: ["Officially canceled the law", "Made the law stricter", "Voted to keep the law", "Renamed the law"], why: "Repeal = officially end or cancel a law." },
  { t: "Key terms", type: "mc", q: "Colonists agreed to stop buying British tea and cloth. This is a…", o: ["Boycott", "Repeal", "Compact", "Social contract"], why: "Refusing to buy goods is a boycott." },
  { t: "Key terms", type: "mc", q: "Which term describes a written, legally binding agreement for self-governance?", o: ["Compact", "Boycott", "Democracy", "Liberty"], why: "That's a compact — like the Mayflower Compact." },

  // ----- Colonial regions -----
  { t: "Colonial regions", type: "mc", q: "Which colonies were the NEW ENGLAND colonies?", o: ["Massachusetts, New Hampshire, Connecticut, Rhode Island", "New York, New Jersey, Pennsylvania, Delaware", "Maryland, Virginia, Georgia", "Florida, Texas, California"], why: "New England = Massachusetts, New Hampshire, Connecticut, Rhode Island." },
  { t: "Colonial regions", type: "mc", q: "Which colonies were the MIDDLE colonies?", o: ["New York, New Jersey, Pennsylvania, Delaware", "Massachusetts, New Hampshire, Connecticut, Rhode Island", "Virginia, North Carolina, South Carolina", "Maine, Vermont, Ohio"], why: "Middle colonies = New York, New Jersey, Pennsylvania, Delaware." },
  { t: "Colonial regions", type: "mc", q: "Which colonies were SOUTHERN colonies?", o: ["Maryland, Virginia, North Carolina, South Carolina, Georgia", "Connecticut, Rhode Island, Massachusetts", "New York, New Jersey, Delaware", "Pennsylvania, New Hampshire, Maine"], why: "Southern = Maryland, Virginia, the Carolinas, Georgia. (Connecticut, Rhode Island, and Massachusetts are New England!)" },
  { t: "Colonial regions", type: "mc", q: "The NEW ENGLAND economy relied on…", o: ["Shipping, fishing, timber, and small-scale farming", "Huge tobacco plantations", "Gold and silver mining", "High-tech industries and finance"], why: "Rocky soil meant New England turned to the sea: shipping, fishing, timber, and small farms." },
  { t: "Colonial regions", type: "mc", q: "The MIDDLE colonies were called the \"breadbasket\" because…", o: ["They grew lots of grain like wheat, plus trade in busy port cities", "They baked the king's bread", "They only fished for cod", "They grew sugar cane"], why: "The Middle colonies grew grain and had busy trading ports like New York and Philadelphia." },
  { t: "Colonial regions", type: "mc", q: "The SOUTHERN economy was centered on…", o: ["Plantations growing cash crops like tobacco, rice, and indigo", "Shipbuilding and cod fishing", "Fur trapping in the mountains", "Factories and railroads"], why: "Warm weather and rich soil made the South a plantation economy — tobacco, rice, indigo — tragically worked largely by enslaved people." },
  { t: "Colonial regions", type: "mc", q: "Which were cash crops of the SOUTHERN colonies?", o: ["Tobacco, rice, and indigo", "Wheat, corn, and oats", "Cotton candy and sugar", "Apples and cranberries"], why: "The South's big cash crops were tobacco, rice, and indigo." },
  { t: "Colonial regions", type: "mc", q: "Virginia was in which colonial region?", o: ["Southern", "New England", "Middle", "Western"], why: "Virginia was a Southern colony." },
  { t: "Colonial regions", type: "mc", q: "Massachusetts was in which colonial region?", o: ["New England", "Middle", "Southern", "Western"], why: "Massachusetts was a New England colony." },
  { t: "Colonial regions", type: "mc", q: "Rhode Island was in which colonial region?", o: ["New England", "Southern", "Middle", "Western"], why: "Rhode Island was a New England colony — watch out, it is NOT Southern." },
  { t: "Colonial regions", type: "mc", q: "Connecticut was in which colonial region?", o: ["New England", "Southern", "Middle", "Western"], why: "Connecticut was a New England colony — it is NOT Southern." },
  { t: "Colonial regions", type: "mc", q: "Pennsylvania was in which colonial region?", o: ["Middle", "New England", "Southern", "Western"], why: "Pennsylvania was a Middle colony." },
  { t: "Colonial regions", type: "mc", q: "New York was in which colonial region?", o: ["Middle", "New England", "Southern", "Western"], why: "New York was a Middle colony." },
  { t: "Colonial regions", type: "mc", q: "Georgia was in which colonial region?", o: ["Southern", "Middle", "New England", "Western"], why: "Georgia was a Southern colony." },

  // ----- Road to revolution -----
  { t: "Road to revolution", type: "mc", q: "What happened during the First Continental Congress?", o: ["Delegates from 12 colonies met to coordinate a united colonial response to Parliament's harsh acts", "The colonists declared war on France", "George Washington was elected president", "The Constitution was written"], why: "Delegates from 12 colonies coordinated a united response to British Parliament's harsh acts." },
  { t: "Road to revolution", type: "mc", q: "How many colonies sent delegates to the First Continental Congress?", o: ["12", "13", "10", "3"], why: "Delegates came from 12 colonies (Georgia stayed home)." },
  { t: "Road to revolution", type: "mc", q: "Why did the Proclamation of 1763 upset the colonists?", o: ["It banned them from settling on the fertile lands west of the Appalachian Mountains that they believed they had won", "It raised the tax on tea", "It closed Boston Harbor", "It forced them to house soldiers"], why: "It banned settlement west of the Appalachians — land colonists believed they had won." },
  { t: "Road to revolution", type: "type", q: "The Proclamation of 1763 banned settling west of the ____ Mountains.", a: "appalachian", accept: ["appalachians", "apalachian", "appalacian"], why: "The Appalachian Mountains were the line colonists couldn't cross." },
  { t: "Road to revolution", type: "mc", q: "The Fundamental Orders of Connecticut is known as…", o: ["The first written constitution in America", "The first tax law", "A peace treaty with Britain", "The first newspaper"], why: "The Fundamental Orders of Connecticut = the first written constitution in America." },
  { t: "Road to revolution", type: "type", q: "The Fundamental Orders of Connecticut is known as the first written ____ in America.", a: "constitution", accept: ["consitution", "constetution"], why: "It was the first written constitution in America." },
  { t: "Road to revolution", type: "mc", q: "Why did the colonists set up their own form of government?", o: ["The great distance from Britain made local rule necessary", "The king ordered them to", "They wanted to join France", "They had no laws at all"], why: "Britain was an ocean away — the great distance made local rule necessary." },
  { t: "Road to revolution", type: "mc", q: "How did EARLY colonists feel about British rule over the colonies?", o: ["They felt a deep pride in being British", "They hated Britain from the very start", "They wanted to be French", "They didn't know who ruled them"], why: "Early colonists were proud, loyal British subjects — the anger came later." },
  { t: "Road to revolution", type: "mc", q: "Parts of the Declaration of Independence were inspired by what ideas?", o: ["17th and 18th century European Enlightenment ideas, especially John Locke's philosophy", "Ancient Egyptian laws", "British military rules", "Viking legends"], why: "Enlightenment ideas — particularly the political philosophy of John Locke." },
  { t: "Road to revolution", type: "type", q: "The Declaration of Independence was inspired by the political philosophy of John ____.", a: "locke", accept: ["lock"], why: "John Locke — natural rights and the social contract." },
  { t: "Road to revolution", type: "mc", q: "What benefits did England enjoy by having colonies?", o: ["Economic gain and geopolitical power under the economic system of mercantilism", "Nothing at all", "Free vacations for the king", "Better weather"], why: "Colonies meant economic gain and power under mercantilism." },
  { t: "Road to revolution", type: "type", q: "England profited from its colonies under the economic system called ____.", a: "mercantilism", accept: ["mercantalism", "merchantilism", "mercentilism"], why: "Mercantilism — colonies supplied raw materials and bought British goods." },

  // ----- Founding documents -----
  { t: "Founding documents", type: "mc", q: "What is the BIG IDEA of the Magna Carta?", o: ["No one, not even the king, is above the law", "All men can vote", "Colonies should be independent", "Taxes should be higher"], why: "Magna Carta: rule of law — no one, not even the king, is above the law." },
  { t: "Founding documents", type: "mc", q: "What was the PURPOSE of the Magna Carta?", o: ["To stop a civil war and limit the abusive power of King John of England", "To declare independence from Britain", "To create the US Congress", "To end slavery"], why: "It stopped a civil war by limiting the abusive power of King John." },
  { t: "Founding documents", type: "mc", q: "Which king's abusive power did the Magna Carta limit?", o: ["King John of England", "King George III", "King Louis XVI", "King Henry VIII"], why: "The Magna Carta limited King John of England." },
  { t: "Founding documents", type: "mc", q: "What is the BIG IDEA of the Mayflower Compact?", o: ["It shaped American self-government and the rule of law", "It banned all religion", "It declared war on Spain", "It created the navy"], why: "The Mayflower Compact shaped American self-governance and constitutional theory." },
  { t: "Founding documents", type: "mc", q: "What was the PURPOSE of the Mayflower Compact?", o: ["To establish a temporary framework of self-government and keep order among the settlers", "To limit the king's power in England", "To convince colonists to seek independence", "To set tea prices"], why: "The settlers agreed on temporary self-government to maintain order and protect the colonists." },
  { t: "Founding documents", type: "mc", q: "What did the English Bill of Rights do?", o: ["Limited the power of the monarch", "Gave the king absolute power", "Freed the American colonies", "Created the police"], why: "The English Bill of Rights limited the power of the monarch." },
  { t: "Founding documents", type: "mc", q: "What are the BIG IDEAS of Cato's Letters?", o: ["Individual liberty, natural rights, and skepticism of government power", "Loyalty to the king above all", "Higher taxes for everyone", "Building a bigger army"], why: "Cato's Letters: individual liberty, natural rights, and an unyielding skepticism of government power." },
  { t: "Founding documents", type: "mc", q: "What was the PURPOSE of Cato's Letters?", o: ["To defend civil and religious liberty and convince people to support freedom", "To sell tea", "To map the colonies", "To crown a new king"], why: "They defended civil and religious liberty and convinced people to support freedom." },
  { t: "Founding documents", type: "mc", q: "What is the BIG IDEA of Common Sense?", o: ["It argued forcefully for American independence from Great Britain", "It said colonists should obey the king", "It described farming techniques", "It supported the Stamp Act"], why: "Common Sense argued forcefully for American independence." },
  { t: "Founding documents", type: "mc", q: "What was the PURPOSE of Common Sense?", o: ["To convince the American colonists to seek complete independence from Great Britain", "To stop a civil war in England", "To keep order aboard the Mayflower", "To limit the monarch's power"], why: "Its purpose: convince colonists to seek complete independence from Great Britain." },
  { t: "Founding documents", type: "mc", q: "\"Rule of law — even the king must obey.\" Which document says this FIRST?", o: ["Magna Carta", "Common Sense", "Cato's Letters", "Mayflower Compact"], why: "That's the Magna Carta (1215) — no one is above the law." },
  { t: "Founding documents", type: "mc", q: "Which document was a COMPACT — a written agreement for self-governance among settlers?", o: ["The Mayflower Compact", "The Magna Carta", "Common Sense", "The English Bill of Rights"], why: "The Mayflower Compact — settlers agreeing to govern themselves." },
  { t: "Founding documents", type: "mc", q: "Which document defended CIVIL and RELIGIOUS liberty?", o: ["Cato's Letters", "The Magna Carta", "The Mayflower Compact", "The Proclamation of 1763"], why: "Cato's Letters defended civil and religious liberty." },
  { t: "Founding documents", type: "type", q: "The pamphlet that convinced colonists to seek independence was called Common ____.", a: "sense", accept: ["sence"], why: "Common Sense, by Thomas Paine." },
  { t: "Founding documents", type: "mc", q: "Which document LIMITED THE POWER OF THE MONARCH in England?", o: ["The English Bill of Rights", "Common Sense", "The Mayflower Compact", "Cato's Letters"], why: "The English Bill of Rights limited the monarch's power." },
];
const QUIZ_LEN = 15;

/* ================= typed-answer matching ================= */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 99;
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1])
        dp[i][j] = Math.min(dp[i][j], dp[i - 2][j - 2] + 1);
    }
  return dp[a.length][b.length];
}
function matches(guess, q) {
  const g = norm(guess);
  if (!g) return false;
  return [q.a, ...(q.accept || [])].map(norm).some(c => {
    if (c === g) return true;
    if (c.length >= 8 && lev(c, g) <= 2) return true;
    if (c.length >= 4 && lev(c, g) <= 1) return true;
    return false;
  });
}

/* ================= helpers ================= */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================= storage =================
   Always saves to this browser. Hosted with a server (Cloudflare Pages),
   /api/scores keeps one shared list so every device sees the same history. */
const KEY = "colony-quest-history";
const API = "/api/scores";
let apiSynced = false;

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function saveLocal(h) {
  try { localStorage.setItem(KEY, JSON.stringify(h)); } catch {}
}
function loadHistory() { return loadLocal(); }

function postRecord(rec) {
  return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rec) });
}
function addRecord(rec) {
  const h = loadLocal(); h.push(rec); saveLocal(h);
  postRecord(rec).catch(() => {});
}
function clearHistory() {
  saveLocal([]);
  if (apiSynced) fetch(API, { method: "DELETE" }).catch(() => {});
}
async function syncApi() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error();
    const server = await res.json();
    if (!Array.isArray(server)) throw new Error();
    const seen = new Set(server.map(r => r.id || r.date));
    const missing = loadLocal().filter(r => !seen.has(r.id || r.date));
    for (const r of missing) { try { await postRecord(r); } catch {} }
    const merged = server.concat(missing).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    saveLocal(merged);
    apiSynced = true;
    if (state.screen === "home" || state.screen === "history") render();
  } catch { apiSynced = false; }
}

/* ================= state ================= */
const app = document.getElementById("app");
const navBtn = document.getElementById("navBtn");
let state = { screen: "home", quiz: [], idx: 0, right: 0, misses: [], locked: false };
let timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function go(screen) {
  clearTimers();
  state.screen = screen;
  if (screen === "home" || screen === "history") syncApi();
  render();
  window.scrollTo(0, 0);
}

navBtn.addEventListener("click", () => {
  if (state.screen === "quiz") {
    if (confirm("Quit this quiz? It won't be scored.")) go("home");
  } else if (state.screen === "home") {
    go("history");
  } else {
    go("home");
  }
});

function pctClass(p) { return p >= 90 ? "pct-good" : p >= 70 ? "pct-mid" : "pct-low"; }

function startQuiz() {
  state.quiz = shuffle(BANK).slice(0, QUIZ_LEN);
  state.idx = 0;
  state.right = 0;
  state.misses = [];
  go("quiz");
}

function render() {
  navBtn.textContent = state.screen === "quiz" ? "Quit" : state.screen === "home" ? "History" : "Home";
  if (state.screen === "home") renderHome();
  else if (state.screen === "quiz") renderQuiz();
  else if (state.screen === "results") renderResults();
  else if (state.screen === "study") renderStudy();
  else renderHistory();
}

function renderHome() {
  const h = loadHistory();
  const best = h.length ? Math.max(...h.map(r => r.percent)) : null;
  const avg = h.length ? Math.round(h.reduce((a, r) => a + r.percent, 0) / h.length) : null;
  app.innerHTML = `
    <div class="card hero seal-top">
      <h1>Conquer the colonies, VJ.</h1>
      <p>${QUIZ_LEN} random questions each round, drawn from ${BANK.length} covering Mr. Jack's whole Colonial America study guide. Instant grading with the why behind every answer.</p>
      <ul class="topic-list">
        <li>Key terms</li><li>Colonial regions</li><li>Road to revolution</li><li>Founding documents</li>
      </ul>
      <div class="btn-row"><button class="btn btn-primary btn-wide" id="startBtn">Start a practice quiz</button></div>
      <div class="btn-row"><button class="btn btn-wide" id="studyBtn">Read the study sheet</button></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num mono">${h.length}</div><div class="lbl">Quizzes</div></div>
      <div class="stat"><div class="num mono">${best === null ? "–" : best + "%"}</div><div class="lbl">Best</div></div>
      <div class="stat"><div class="num mono">${avg === null ? "–" : avg + "%"}</div><div class="lbl">Average</div></div>
    </div>`;
  document.getElementById("startBtn").addEventListener("click", startQuiz);
  document.getElementById("studyBtn").addEventListener("click", () => go("study"));
}

function advance() {
  clearTimers();
  state.idx++;
  if (state.idx >= state.quiz.length) finishQuiz();
  else render();
}

function renderQuiz() {
  const q = state.quiz[state.idx];
  const n = state.quiz.length;
  const isMC = q.type === "mc";
  const qHTML = esc(q.q).replace(/____/g, '<span class="blank">&nbsp;</span>');

  let answerHTML;
  let opts = [];
  if (isMC) {
    opts = shuffle(q.o.map((text, i) => ({ text, correct: i === 0 })));
    answerHTML = `<div class="opts">${opts.map((o, i) =>
      `<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join("")}</div>`;
  } else {
    answerHTML = `<div class="answer-line">
        <input class="answer" id="ansInput" type="text" autocomplete="off" autocapitalize="off" placeholder="Type your answer" aria-label="Your answer">
        <button class="btn btn-primary" id="checkBtn">Check</button>
      </div>`;
  }

  app.innerHTML = `
    <div class="progress">
      <div class="label"><span>Question ${state.idx + 1} of ${n}</span><span>${esc(q.t)}</span></div>
      <div class="bar"><div style="width:${((state.idx + 1) / n) * 100}%"></div></div>
    </div>
    <div class="card">
      <div class="qtopic">${esc(q.t)}</div>
      <p class="qtext">${qHTML}</p>
      ${answerHTML}
      <div class="feedback neutral" id="feedback">${isMC ? "Tap the best answer." : "Little typos are forgiven — spelling doesn't have to be perfect."}</div>
    </div>`;

  const feedback = document.getElementById("feedback");
  const showWhy = ok => {
    feedback.className = "feedback " + (ok ? "right" : "wrong");
    feedback.innerHTML = (ok ? "Correct! ✓" : `Not quite — the answer is <b>${esc(isMC ? q.o[0] : q.a)}</b>.`) +
      `<span class="why">${esc(q.why)}</span>` +
      (ok ? "" : ` <button class="navlink" id="nextBtn">Next →</button>`);
    if (!ok) document.getElementById("nextBtn").addEventListener("click", advance);
  };

  if (isMC) {
    app.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.locked) return;
        state.locked = true;
        const chosen = opts[Number(btn.dataset.i)];
        app.querySelectorAll(".opt").forEach((b, i) => {
          b.disabled = true;
          if (opts[i].correct) b.classList.add("right");
          else if (b === btn) b.classList.add("wrong");
          else b.classList.add("dim");
        });
        if (chosen.correct) {
          state.right++;
          showWhy(true);
          later(() => { state.locked = false; advance(); }, 1300);
        } else {
          state.misses.push({ q: q.q, a: chosen.text, c: q.o[0] });
          showWhy(false);
          state.locked = false;
        }
      });
    });
  } else {
    const input = document.getElementById("ansInput");
    const checkBtn = document.getElementById("checkBtn");
    const submit = () => {
      if (state.locked) return;
      const guess = input.value.trim();
      if (!guess) { input.focus(); return; }
      state.locked = true;
      input.disabled = true; checkBtn.disabled = true;
      if (matches(guess, q)) {
        state.right++;
        showWhy(true);
        later(() => { state.locked = false; advance(); }, 1300);
      } else {
        state.misses.push({ q: q.q, a: guess.slice(0, 60), c: q.a });
        showWhy(false);
        state.locked = false;
      }
    };
    checkBtn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  state.locked = false;
}

function finishQuiz() {
  clearTimers();
  const total = state.quiz.length;
  const percent = Math.round((state.right / total) * 100);
  const rec = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    date: new Date().toISOString(),
    right: state.right, total, percent,
    misses: state.misses.map(m => ({ q: m.q, a: m.a, c: m.c })),
  };
  addRecord(rec);
  state.lastResult = rec;
  go("results");
}

function missListHTML(misses) {
  return misses.length
    ? `<ul class="misslist">${misses.map(m =>
        `<li><span class="q">${esc(m.q)}</span>
         <span class="a">${esc(m.a)}</span> → <span class="cor">${esc(m.c)}</span></li>`).join("")}</ul>`
    : `<div class="allgood">Nothing missed — perfect round!</div>`;
}

function renderResults() {
  const r = state.lastResult;
  const msg = r.percent === 100 ? "Huzzah! A perfect round! \u{1F3C6}"
    : r.percent >= 90 ? "Excellent — you know your colonies!"
    : r.percent >= 70 ? "Good work — review the misses below."
    : "Keep going — read the study sheet, then try again.";
  app.innerHTML = `
    <div class="card score-hero seal-top">
      <div class="score-big mono" style="color:${r.percent >= 90 ? "var(--good)" : r.percent >= 70 ? "var(--accent)" : "var(--bad)"}">${r.right}/${r.total}</div>
      <div class="score-msg">${msg}</div>
      <div class="score-sub">${r.percent}% · saved to history</div>
      <div class="btn-row">
        <button class="btn" id="studyBtn">Study sheet</button>
        <button class="btn btn-primary" id="againBtn">New quiz</button>
      </div>
    </div>
    <div class="card">
      <h2 style="font-size:22px">${r.misses.length ? "What you missed" : "Clean sheet"}</h2>
      ${missListHTML(r.misses)}
    </div>`;
  document.getElementById("againBtn").addEventListener("click", startQuiz);
  document.getElementById("studyBtn").addEventListener("click", () => go("study"));
  if (r.percent >= 90) confetti();
}

function renderHistory() {
  const h = loadHistory().slice().reverse();
  const missCount = {};
  h.forEach(r => (r.misses || []).forEach(m => { missCount[m.q] = (missCount[m.q] || 0) + 1; }));
  const worst = Object.entries(missCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxMiss = worst.length ? worst[0][1] : 1;

  const rows = h.map(r => {
    const d = new Date(r.date);
    const date = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    return `<details class="hrow">
        <summary>
          <div class="hdate">${date}<small>${time}</small></div>
          <span class="hscore">${r.right}/${r.total}</span>
          <span class="hpct ${pctClass(r.percent)}">${r.percent}%</span>
        </summary>
        <div class="hdetail">${missListHTML(r.misses || [])}</div>
      </details>`;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <h2 style="font-size:24px">Quiz history</h2>
      <p style="color:var(--muted);font-size:14px;margin:6px 0 4px">Tap a quiz to see exactly what was missed.</p>
      ${h.length ? rows : `<div class="empty">No quizzes yet — take your first one!</div>`}
    </div>
    ${worst.length ? `<div class="card trouble"><h2 style="font-size:24px">Trouble questions</h2>
      <p style="color:var(--muted);font-size:14px;margin:6px 0 10px">Missed most often — drill these first.</p>
      ${worst.map(([qq, n]) =>
        `<div class="tlabel"><span style="max-width:75%">${esc(qq)}</span><span class="mono">${n}×</span></div>
         <div class="tbar"><div style="width:${(n / maxMiss) * 100}%"></div></div>`).join("")}</div>` : ""}
    <div class="btn-row"><button class="btn btn-primary btn-wide" id="startBtn">Start a practice quiz</button></div>
    ${h.length ? `<div class="btn-row"><button class="btn btn-danger btn-wide" id="clearBtn">Clear history</button></div>` : ""}
    <p class="footnote">${apiSynced
      ? "Scores sync — open this same link on any phone or computer to see them."
      : "History is saved on this device."}</p>`;

  document.getElementById("startBtn").addEventListener("click", startQuiz);
  const clearBtn = document.getElementById("clearBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => {
    if (confirm("Delete all saved scores? This can't be undone.")) { clearHistory(); render(); }
  });
}

function renderStudy() {
  app.innerHTML = `
    <div class="card study seal-top">
      <h2 style="font-size:24px;margin-bottom:4px">The whole guide, small enough for a phone</h2>
      <h3>Key terms</h3>
      <ul>
        <li><b>Democracy</b> — a type of government in which the people rule.</li>
        <li><b>Social contract</b> — an agreement between the government and the people.</li>
        <li><b>Liberty</b> — the state of being free in society.</li>

        <li><b>Repeal</b> — to officially end or cancel a law.</li>
        <li><b>Compact</b> — a written, legally binding agreement for self-governance.</li>
      </ul>
      <h3>The three colonial regions</h3>
      <div class="tablewrap"><table>
        <tr><th>Region</th><th>Colonies</th><th>Economy</th></tr>
        <tr><td><b>New England</b></td><td>Massachusetts, New Hampshire, Connecticut, Rhode Island</td><td>Shipping, fishing, timber, small-scale farming</td></tr>
        <tr><td><b>Middle</b></td><td>New York, New Jersey, Pennsylvania, Delaware</td><td>The "breadbasket" — grain farming and trade in busy ports</td></tr>
        <tr><td><b>Southern</b></td><td>Maryland, Virginia, North Carolina, South Carolina, Georgia</td><td>Plantations growing cash crops: tobacco, rice, indigo</td></tr>
      </table></div>

      <ul>

        <tr><td><b>Mayflower Compact</b></td><td>Shaped American self-government</td><td>Temporary self-government; keep order among the settlers</td></tr>
        <tr><td><b>English Bill of Rights</b></td><td>Limited government</td><td>Limit the power of the monarch</td></tr>
        <tr><td><b>Cato's Letters</b></td><td>Individual liberty, natural rights, skepticism of government power</td><td>Defend civil &amp; religious liberty; convince people to support freedom</td></tr>
        <tr><td><b>Common Sense</b></td><td>Argued forcefully for American independence</td><td>Convince colonists to seek complete independence from Great Britain</td></tr>
      </table></div>
      <div class="btn-row"><button class="btn btn-primary btn-wide" id="startBtn">I'm ready — quiz me</button></div>
    </div>`;
  document.getElementById("startBtn").addEventListener("click", startQuiz);
}

/* ================= confetti ================= */
function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti");
  cv.hidden = false;
  cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext("2d");
  const colors = ["#96342B", "#274C77", "#FDF8EC", "#3B7A3A", "#DCCFB4"];
  const bits = Array.from({ length: 120 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
    vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
    s: 5 + Math.random() * 6, r: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2,
    col: colors[Math.floor(Math.random() * colors.length)],
  }));
  let frames = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.col; ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.6);
      ctx.restore();
    }
    if (++frames < 220) requestAnimationFrame(loop);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}

render();
syncApi();
</script>
